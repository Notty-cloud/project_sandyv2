[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m pip install -r requirements.txt",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "python3 manage.py collectstatic --noinput"
]

[start]
cmd = "python3 manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
