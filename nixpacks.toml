[phases.setup]
nixPkgs = ["python312", "uv", "nodejs_20"]

[phases.install]
cmds = [
  "uv venv /app/.venv",
  "uv pip install -r requirements.txt --python /app/.venv",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "/app/.venv/bin/python manage.py collectstatic --noinput"
]

[start]
cmd = "/app/.venv/bin/python manage.py migrate && /app/.venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
